<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description" lang="zh-CN">
  <title id="title">dsh-mnemon 运行时架构</title>
  <desc id="description">DSH Web、主 Agent 和工具命令进入 dsh-mnemon 控制与监督层，再分别连接运行时热记忆、项目档案和 Mnemon 长期记忆体。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .canvas { fill: #f7f9fc; }
    .section { fill: #f0f3f8; stroke: #d7deea; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #d7deea; stroke-width: 1.5; filter: url(#shadow); }
    .card-hot { fill: #fff3df; stroke: #c66a09; }
    .card-doc { fill: #e8f1ff; stroke: #2563be; }
    .card-long { fill: #e2f7ef; stroke: #087c5b; }
    .title { font-size: 34px; font-weight: 720; letter-spacing: -0.6px; }
    .subtitle { font-size: 17px; fill: #647086; }
    .section-title { font-size: 17px; font-weight: 700; fill: #6558d9; letter-spacing: 0.4px; }
    .node-title { font-size: 21px; font-weight: 700; }
    .node-copy { font-size: 15px; fill: #647086; }
    .node-code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; fill: #647086; }
    .store-title { font-size: 23px; font-weight: 740; }
    .store-copy { font-size: 15px; fill: #647086; }
    .pill { fill: #f0f3f8; stroke: #d7deea; }
    .pill-text { font-size: 13px; font-weight: 650; fill: #647086; }
    .flow { fill: none; stroke: #aeb9ca; stroke-width: 2.5; marker-end: url(#arrow); }
    .flow-hot { stroke: #c66a09; marker-end: url(#arrow-hot); }
    .flow-doc { stroke: #2563be; marker-end: url(#arrow-doc); }
    .flow-long { stroke: #087c5b; marker-end: url(#arrow-long); }
    .flow-supervised { stroke: #6558d9; stroke-dasharray: 8 7; marker-end: url(#arrow-accent); }
    .flow-label { font-size: 13px; font-weight: 650; fill: #647086; }
    .legend { font-size: 13px; fill: #647086; }
    .legend-line, .bus-line { marker-end: none; }
    .bar-hot { fill: #c66a09; }
    .bar-doc { fill: #2563be; }
    .bar-long { fill: #087c5b; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#21314d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aeb9ca"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c66a09"/>
    </marker>
    <marker id="arrow-doc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563be"/>
    </marker>
    <marker id="arrow-long" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087c5b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6558d9"/>
    </marker>
  </defs>

  <rect class="canvas" width="1600" height="1040" rx="24"/>
  <text class="title" x="64" y="58">dsh-mnemon 运行时架构</text>
  <text class="subtitle" x="64" y="87">DSH 负责监督与编排 · Mnemon 负责确定性长期存储 · 三层数据保留在本地</text>
  <rect class="section" x="48" y="300" width="1504" height="394" rx="24"/>

  <g aria-label="DSH 交互入口">
    <rect class="card" x="64" y="124" width="430" height="126" rx="18"/>
    <rect class="pill" x="88" y="146" width="96" height="27" rx="13.5"/>
    <text class="pill-text" x="136" y="165" text-anchor="middle">DSH WEB</text>
    <text class="node-title" x="88" y="204">记忆体工作台与插件设置</text>
    <text class="node-copy" x="88" y="231">八个页面 · 中文/英文 · 全局明暗主题</text>

    <rect class="card" x="585" y="124" width="430" height="126" rx="18"/>
    <rect class="pill" x="609" y="146" width="112" height="27" rx="13.5"/>
    <text class="pill-text" x="665" y="165" text-anchor="middle">ROOT AGENT</text>
    <text class="node-title" x="609" y="204">当前任务与主上下文</text>
    <text class="node-copy" x="609" y="231">当前指令和实时事实始终优先</text>

    <rect class="card" x="1106" y="124" width="430" height="126" rx="18"/>
    <rect class="pill" x="1130" y="146" width="142" height="27" rx="13.5"/>
    <text class="pill-text" x="1201" y="165" text-anchor="middle">TOOLS · COMMANDS</text>
    <text class="node-title" x="1130" y="204">模型工具与 /mnemon 命令</text>
    <text class="node-copy" x="1130" y="231">显式召回、沉淀、关系、状态与维护</text>
  </g>

  <g aria-hidden="true">
    <path class="flow" d="M279 250 V281 H1298 V350"/>
    <path class="flow flow-supervised" d="M800 250 V350"/>
    <path class="flow" d="M1321 250 V292 H800 V350"/>
    <text class="flow-label" x="1042" y="276">typed RPC</text>
    <text class="flow-label" x="815" y="302">工具调用</text>
  </g>

  <text class="section-title" x="80" y="337">DSH HOST · DSH-MNEMON 控制与监督层</text>

  <g aria-hidden="true">
    <path class="flow bus-line" d="M300 476 V498"/>
    <path class="flow flow-supervised bus-line" d="M800 476 V498"/>
    <path class="flow bus-line" d="M1300 476 V498"/>
    <path class="flow bus-line" d="M245 498 H1300"/>
    <path class="flow" d="M245 498 V520"/>
    <path class="flow" d="M615 498 V520"/>
    <path class="flow" d="M985 498 V520"/>
    <path class="flow" d="M990 630 H1190"/>
  </g>

  <g aria-label="监督与权限组件">
    <rect class="card" x="100" y="350" width="400" height="126" rx="17"/>
    <text class="node-title" x="126" y="390">Prompt 与 Lifecycle</text>
    <text class="node-copy" x="126" y="420">热记忆注入 · 短提示 · 活动评分</text>
    <text class="node-code" x="126" y="448">pre-step · turn/end · idle review</text>

    <rect class="card" x="600" y="350" width="400" height="126" rx="17"/>
    <text class="node-title" x="626" y="390">Subagent Coordinator</text>
    <text class="node-copy" x="626" y="420">spawn 隔离任务 · fork 已完成 checkpoint</text>
    <text class="node-code" x="626" y="448">persona · allowlist · schema · depth=1</text>

    <rect class="card" x="1100" y="350" width="400" height="126" rx="17"/>
    <text class="node-title" x="1126" y="390">RPC 与权限边界</text>
    <text class="node-copy" x="1126" y="420">trusted-host 读取 · loopback 写入</text>
    <text class="node-code" x="1126" y="448">read · write · settings channels</text>
  </g>

  <g aria-label="确定性控制组件">
    <rect class="card" x="80" y="520" width="330" height="110" rx="16"/>
    <text class="node-title" x="104" y="559">Runtime Memory</text>
    <text class="node-copy" x="104" y="587">JSON 事实源 · Markdown 投影</text>
    <text class="node-code" x="104" y="612">lock · revision · UTF-8</text>

    <rect class="card" x="450" y="520" width="330" height="110" rx="16"/>
    <text class="node-title" x="474" y="559">Documents</text>
    <text class="node-copy" x="474" y="587">索引 · 检索 · active / archived</text>
    <text class="node-code" x="474" y="612">path boundary · LRU · SHA-256</text>

    <rect class="card" x="820" y="520" width="330" height="110" rx="16"/>
    <text class="node-title" x="844" y="559">Mnemon Service</text>
    <text class="node-copy" x="844" y="587">记忆体路由 · 召回 · 关系 · 图谱</text>
    <text class="node-code" x="844" y="612">active read · targeted write</text>

    <rect class="card" x="1190" y="520" width="280" height="110" rx="16"/>
    <text class="node-title" x="1214" y="559">CLI Runner</text>
    <text class="node-copy" x="1214" y="587">参数数组 · 禁用 shell</text>
    <text class="node-code" x="1214" y="612">serialized · timeout</text>
  </g>

  <g aria-hidden="true">
    <path class="flow flow-hot" d="M245 630 V760"/>
    <path class="flow flow-doc" d="M615 630 V724 H800 V760"/>
    <path class="flow flow-long" d="M1330 630 V724 H1310 V760"/>
    <text class="flow-label" x="262" y="718">每轮投影</text>
    <text class="flow-label" x="632" y="714">受管 Markdown</text>
    <text class="flow-label" x="1344" y="713">本地 CLI</text>
  </g>

  <g aria-label="三层本地存储">
    <rect class="card card-hot" x="64" y="760" width="440" height="194" rx="20"/>
    <rect class="bar-hot" x="88" y="784" width="9" height="48" rx="4.5"/>
    <text class="store-title" x="116" y="809">运行时热记忆</text>
    <text class="node-code" x="116" y="834">&lt;storageRoot&gt;/runtime</text>
    <text class="store-copy" x="88" y="870">memories.json 是唯一事实源</text>
    <text class="store-copy" x="88" y="898">USER.md 4 KiB · MEMORY.md 10 KiB</text>
    <text class="store-copy" x="88" y="926">紧凑内容每轮直接进入主上下文</text>

    <rect class="card card-doc" x="580" y="760" width="440" height="194" rx="20"/>
    <rect class="bar-doc" x="604" y="784" width="9" height="48" rx="4.5"/>
    <text class="store-title" x="632" y="809">项目档案</text>
    <text class="node-code" x="632" y="834">&lt;storageRoot&gt;/documents</text>
    <text class="store-copy" x="604" y="870">index.json · active/ · archived/</text>
    <text class="store-copy" x="604" y="898">保留完整 Markdown 叙事与来源</text>
    <text class="store-copy" x="604" y="926">先建立冷引用，再迁移原文</text>

    <rect class="card card-long" x="1096" y="760" width="440" height="194" rx="20"/>
    <rect class="bar-long" x="1120" y="784" width="9" height="48" rx="4.5"/>
    <text class="store-title" x="1148" y="809">Mnemon 记忆体</text>
    <text class="node-code" x="1148" y="834">&lt;storageRoot&gt;/data/&lt;space-id&gt;/mnemon.db</text>
    <text class="store-copy" x="1120" y="870">独立 SQLite Store · active 读取边界</text>
    <text class="store-copy" x="1120" y="898">temporal · semantic · causal · entity</text>
    <text class="store-copy" x="1120" y="926">跨会话、按需、带来源的长期证据</text>
  </g>

  <g aria-label="图例">
    <line x1="70" y1="996" x2="112" y2="996" class="flow legend-line"/>
    <text class="legend" x="124" y="1001">确定性数据 / 控制路径</text>
    <line x1="346" y1="996" x2="388" y2="996" class="flow flow-supervised legend-line"/>
    <text class="legend" x="400" y="1001">LLM 监督路径</text>
    <text class="legend" x="1532" y="1001" text-anchor="end">所有持久数据位于选定 storageRoot</text>
  </g>
</svg>
