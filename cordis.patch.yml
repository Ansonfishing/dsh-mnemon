# Mount the Mnemon bridge into a DSH profile. The profile's own final patch
# may replace this config row to select an explicit binary or data directory.
- insert:
    - id: mnemon
      name: dsh-mnemon
      config:
        routingGuidance: true
        displayMode: sidebar
        lifecycleEnabled: true
        recallMode: guided
        writebackMode: guided
        idleReviewMs: 30000
        tabEnabled: true
        writeEnabled: true
        timeoutMs: 10000
        defaultRecallLimit: 10
