name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Go for Windows smoke test
        if: runner.os == 'Windows'
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x

      - name: Install pnpm
        run: npm install --global pnpm@10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run verify

      - name: Install Mnemon outside PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $HOME 'go\bin'
          go install github.com/mnemon-dev/mnemon@v0.2.2

      - name: Smoke-test default Windows discovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goBin = Join-Path $HOME 'go\bin'
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_.TrimEnd('\') -ine $goBin.TrimEnd('\') }) -join ';'
          Remove-Item Env:GOBIN -ErrorAction SilentlyContinue
          Remove-Item Env:GOPATH -ErrorAction SilentlyContinue
          Remove-Item Env:MNEMON_CLI_PATH -ErrorAction SilentlyContinue
          $env:RUN_WINDOWS_MNEMON_SMOKE = '1'
          pnpm exec vitest run tests/windows-smoke.spec.ts
